<script>
  // GitHub se PWA files load karna
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'https://moazzamazmi333-ui.github.io/bookgadi-render-pwa/manifest.json';
  document.head.appendChild(link);

  // Service Worker ko Wix domain par link karna
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('https://moazzamazmi333-ui.github.io/bookgadi-render-pwa/sw.js');
  }

  // Wix Velo Button ke liye message handler
  window.addEventListener('message', (event) => {
    if (event.data === "install_pwa") {
      // Isse aapka GitHub wala "index.html" page ek naye tab mein khulega 
      // jahan "Install App" ka button 100% kaam karega
      window.open("https://moazzamazmi333-ui.github.io/bookgadi-render-pwa/", "_blank");
    }
  });
  // Check karein agar app pehle se installed hai
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  document.getElementById("installBtn").style.display = "none";
  // Agar aapne open button banaya hai toh use dikha sakte hain
  if(document.getElementById("openBtn")) {
     document.getElementById("openBtn").style.display = "inline-block";
  }
}

// Install hone ke turant baad button ko hide karne ke liye
window.addEventListener("appinstalled", () => {
  document.getElementById("installBtn").style.display = "none";
  console.log("App installed successfully");
});
</script>
