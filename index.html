<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookgadi Taxi Service</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b5ed7">

  <style>
    body{
      margin:0;
      font-family: system-ui, Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      background:#f7f7f7;
      text-align:center;
    }
    .box{
      max-width:420px;
      padding:20px;
    }
    h1{ margin:0; font-size:22px; }
    p{ color:#666; margin:10px 0 18px; }
    #btn{
      display:none;
      background:#0b5ed7;
      color:#fff;
      border:none;
      padding:12px 18px;
      border-radius:25px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Bookgadi Taxi Service</h1>
    <p>Install this app on your phone.</p>
    <button id="btn">📲 Install Now</button>
  </div>

  <script>
    // Service worker register
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    let deferredPrompt = null;
    const btn = document.getElementById("btn");

    // Install prompt handler
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = "inline-block";
    });

    btn.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;

      // After install / click, open tracking page
      window.location.href = "https://www.bookgadi.com";
    });

    // If user already installed, redirect directly
    window.addEventListener("appinstalled", () => {
      window.location.href = "https://www.bookgadi.com";
    });

    // Optional: Auto redirect after 3 sec
    setTimeout(() => {
      // user can still install, but will go to live page
      window.location.href = "https://www.bookgadi.com1";
    }, 3000);
  </script>

</body>
</html>
