<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bookgadi Taxi Service</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b5ed7">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="margin:0;font-family:system-ui;text-align:center;padding-top:35vh">

  <h2>Bookgadi Taxi Service</h2>
  <p>Tap below to open Bookgadi</p>

  <button onclick="openSite()"
    style="background:#0b5ed7;color:#fff;border:none;
           padding:14px 22px;border-radius:25px;font-size:16px">
    Open Bookgadi
  </button>

  <script>
    function openSite(){
      window.open(
        "https://www.bookgadi.com",
        "_blank"
      );
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
